<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Guard POS</title>
<style>
:root { --bg:#0e1116; --panel:#171b22; --line:#262c36; --text:#e6e9ee; --muted:#8b95a5;
        --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
@media (prefers-color-scheme: light) {
  :root { --bg:#f6f7f9; --panel:#fff; --line:#e3e6eb; --text:#141820; --muted:#5d6675; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
header { display:flex; gap:14px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header strong { margin-right:auto; }
header a { color:var(--muted); text-decoration:none; }
main { max-width:1100px; margin:0 auto; padding:16px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
.muted { color:var(--muted); font-size:14px; }
.grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
table { width:100%; border-collapse:collapse; font-size:15px; }
th,td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
.table-wrap { overflow-x:auto; }
input,select,textarea,button { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 11px; }
input { max-width:100%; }
button { background:var(--accent); border-color:var(--accent); color:#fff; cursor:pointer; }
button.secondary { background:transparent; color:var(--text); border-color:var(--line); }
button.danger { background:var(--bad); border-color:var(--bad); }
.bad { color:var(--bad); } .ok { color:var(--ok); } .warn { color:var(--warn); }
.big { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; }
form.inline { display:inline-flex; gap:6px; flex-wrap:wrap; align-items:center; margin:0; }
.stack > * { display:block; width:100%; margin-bottom:8px; }
pre { white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>
<header>
  <strong>{{ shop or 'Shop Guard POS' }}</strong>
  {% if user %}<span class="muted">{{ user.name }} ({{ user.role }})</span>
  {% if user.is_owner %}<a href="/owner">Dashboard</a><a href="/owner/products">Products</a><a href="/owner/count">Stock count</a>{% endif %}
  <a href="/">Till</a><a href="/logout">Log out</a>{% endif %}
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
