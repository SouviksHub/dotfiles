# 1883: inside the compose network only (not published). Frigate, Sentinel, POS.
# 1884: published on the LAN for devices (drawer sensor). Password + ACL required.
per_listener_settings true
persistence false

listener 1883
allow_anonymous true

listener 1884
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl
